# ============================================================================
# dsh-snapshot —— DSH bundle patch
# ============================================================================
# 容错快照仓库插件。DSH 启动时按 bundle 层栈叠加各插件 patch，本文件把它
# 插入 Web profile 的配置树。
#
# 安装（本地 link）：
#   dsh plugin --profile web add link:D:\users\21656\Desktop\idea\aero-reformation\dsh-snapshot
# 重启 dsh web 后 F5 刷新。
#
# 停用：删掉下面的 id 行，或加 `disabled: true`。
# ============================================================================

- insert:
    - id: dsh-snapshot
      name: dsh-snapshot
